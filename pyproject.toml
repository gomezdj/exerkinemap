[build-system]
requires = ["setuptools>=63.4.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exerkinemap"
version = "0.1.0"
description = "EXERKINEMAP: Exercise-responsive molecular signaling mapping and Exerkinetics module."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Daniel Gomez" }
]
keywords = [
    "exerkine",
    "omics",
    "single-cell",
    "spatial",
    "bioinformatics"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bioinformatics"
]
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "networkx>=2.6.0",
    "torch>=1.10.0",
    "anndata>=0.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "jupyter"
]

[tool.setuptools.packages.find]
include = ["Exerkinetics*", "exerkinemap*"]