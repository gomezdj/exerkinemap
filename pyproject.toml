[build-system]
requires = ["setuptools>=63.4.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exerkinemap"
version = "1.0.0"
description = "EXERKINEMAP: Exercise-responsive molecular signaling mapping."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }

authors = [
    { name = "Daniel Gomez" }
]

keywords = [
    "exerkine",
    "omics",
    "single-cell",
    "spatial",
    "bioinformatics"
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Bioinformatics"
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "networkx",
    "torch",
    "anndata"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "jupyter"
]

license = { file = "MIT" }

[tool.setuptools]
packages = ["exerkinemap"]

[tool.setuptools.package-dir]
"" = "src"
"exerkinemap" = "exerkinemap"

[tool.setuptools]
packages = ["exerkinemap", "workflows"]